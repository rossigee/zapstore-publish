name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  metadata:
    name: Validate action.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm ci

      - name: Check the metadata matches the entry point
        run: |
          node -e '
            const {readFileSync} = require("node:fs");
            const {parse} = require("yaml");
            const action = parse(readFileSync("action.yml", "utf8"));
            if (action.runs?.using !== "node24") throw new Error("runs.using must be node24");
            if (action.runs?.main !== "dist/index.js") throw new Error("runs.main must be dist/index.js");
            for (const field of ["name", "description"]) {
              if (!action[field]) throw new Error(`action.yml is missing ${field}`);
            }
            const source = readFileSync("src/main.ts", "utf8");
            const read = [...source.matchAll(/(?:input|flag)\("([^"]+)"\)/g)].map((m) => m[1]);
            const undeclared = [...new Set(read)].filter((name) => !(name in (action.inputs ?? {})));
            if (undeclared.length) {
              throw new Error(`main.ts reads undeclared inputs: ${undeclared.join(", ")}`);
            }
            console.log("action.yml OK");
            console.log("inputs:", Object.keys(action.inputs).join(", "));
          '

      # The action ships a bundle, not node_modules, so a dependency that is
      # imported but not bundled only fails for consumers. This catches the
      # committed bundle drifting from source, which would otherwise be
      # published silently.
      - name: Check the committed bundle matches the source
        run: |
          npm run build
          git diff --exit-code -- dist/ \
            || { echo "::error::dist/ is stale. Run 'npm run build' and commit the result."; exit 1; }

      - name: Check the bundle imports nothing at runtime
        run: |
          # A bare specifier surviving the bundle means a dependency was left
          # external, which resolves locally and fails for consumers.
          if grep -nE "(^|[^.\"'])\b(require\(|from )[\"']([a-z@][^./\"']*)" dist/index.js \
               | grep -vE "[\"'](node:|assert|util|events|fs|path|crypto|os|stream|buffer|https?)[^\"']*[\"']" \
               | grep -vE "createRequire"; then
            echo "::error::dist/index.js still references external packages."
            exit 1
          fi
          echo "bundle is self-contained"

  self-test:
    name: Run the action on the runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm ci

      - run: npm run build

      # Consumers receive the action without node_modules, so the self-test
      # has to as well. Running in-repo after `npm ci` hides any dependency
      # that is imported but not bundled: it resolves locally and fails only
      # once someone uses the action from another repository. Moving the
      # directory aside reproduces that exactly, and is what caught the
      # unbundled `yaml` import that broke the first real Zapstore publish.
      - name: Hide node_modules to match a consumer checkout
        run: mv node_modules .node_modules_hidden

      - name: Prepare a fixture APK and listing
        run: |
          mkdir -p .selftest
          gunzip -c __tests__/fixtures/minimal-debug.apk.gz > .selftest/app.apk
          cat > .selftest/zapstore.yaml <<'YAML'
          repository: https://github.com/example/example-app
          name: Example App
          summary: Self test
          description: Self test listing.
          license: MIT
          YAML

      # No sign-with, deliberately: check mode must validate a listing with no
      # Nostr identity at all, so CI needs no credential and the repository
      # never handles a key.
      - name: Invoke the action
        id: zapstore
        uses: ./
        with:
          config: .selftest/zapstore.yaml
          apk: .selftest/app.apk
          mode: check

      - name: Assert the APK was read and the certificate matches apksigner
        run: |
          test "${{ steps.zapstore.outputs.apk-sha256 }}" = "28b9bd19e5e235b20e85755fbe806162d1da42ab0fb538cbc7e77d7d27166168"
          test "${{ steps.zapstore.outputs.certificate-sha256 }}" = "925d2fefa4c7ab702ad35df1cf35ba7976faa7f2b2e0dd76d9b35d0859fe5bf9"
          echo "APK sha256 and certificate fingerprint both match the expected values"

      - name: Report the Node version the action ran on
        if: always()
        run: mv .node_modules_hidden node_modules
